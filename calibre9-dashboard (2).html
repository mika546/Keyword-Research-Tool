<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calibre9 — Keyword Intelligence</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback } = React;


const C = {
  black: '#000000', darkgrey: '#1a1a1a', grey: '#2a2a2a', border: '#3a3a3a',
  textgrey: '#666666', lightgrey: '#999999', white: '#FFFFFF',
  magenta: '#e8006e', volt: '#b8ff00', indigo: '#5533ff',
};

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const sep = lines[0].split('\t').length > lines[0].split(',').length ? '\t' : ',';
  const headers = lines[0].split(sep).map(h => h.trim().replace(/^"|"$/g, '').toLowerCase());
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const cols = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; continue; }
      if (ch === sep && !inQ) { cols.push(cur.trim()); cur = ''; continue; }
      cur += ch;
    }
    cols.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (cols[i] || '').replace(/^"|"$/g, '').trim(); });
    return obj;
  });
}

function normalise(row, type) {
  const keys = Object.keys(row);
  const bare = str => str.replace(/[^a-z0-9]/gi, '').toLowerCase();

  if (!normalise._logged) {
    normalise._logged = true;
    console.log('[Calibre9] CSV headers:', keys);
    console.log('[Calibre9] Headers (bare):', keys.map(bare));
  }

  const find = (exactList, containsList = []) => {
    const exactKey = keys.find(k => exactList.includes(bare(k)));
    if (exactKey) return row[exactKey];
    if (containsList.length) {
      const containsKey = keys.find(k => containsList.some(c => bare(k).includes(c)));
      if (containsKey) return row[containsKey];
    }
    return '';
  };

  const keyword = (
    find(['keyword','keywords','query','searchterm','term','searchquery'], ['keyword','query','term'])
    || Object.values(row)[0] || ''
  ).toLowerCase().trim();

  const url = type === 'comp' ? 'N/A' : (
    find(
      ['currenturl','currenturls','url','urls','page','landingpage','toppage','rankingurl','rankurl','href','link','address','path','targeturl'],
      ['currenturl','landingpage','toppage','rankingurl','rankurl','href']
    ) || 'N/A'
  );

  const svRaw = find(
    ['searchvolume','volume','sv','monthlyvolume','avgmonthly','avgsearchespermonth','avgsearches','organictraffic','traffic'],
    ['volume','searchvol','organictraffic','traffic']
  ) || '0';
  const sv = parseInt(svRaw.replace(/[^0-9]/g, ''), 10) || 0;

  const location = find(['location','country','countrycode','geo'], ['location','country']) || '';

  const positionRaw = find(
    ['currentposition','currentpositions','currentrank','position','positions','rank','ranking','serp','serpposition'],
    ['currentposition','currentrank','position','rank']
  ) || '';
  const position = positionRaw ? parseInt(positionRaw.replace(/[^0-9]/g, ''), 10) || null : null;

  return { keyword, url, sv, position, source: type === 'comp' ? 'Competitor' : 'Client', location };
}

function extractBrand(siteUrl) {
  if (!siteUrl?.trim()) return null;
  try {
    const url = new URL(siteUrl.trim().startsWith('http') ? siteUrl.trim() : 'https://' + siteUrl.trim());
    const hostname = url.hostname.replace(/^www\./, '');
    const parts = hostname.split('.');
    return parts.length >= 2 ? parts[parts.length - 2].toLowerCase() : parts[0].toLowerCase();
  } catch (e) { return null; }
}

// ── Collection URL parser ────────────────────────────────────────────────────
function parseCollectionUrl(url) {
  try {
    const u = new URL(url.trim().startsWith('http') ? url.trim() : 'https://' + url.trim());
    const segments = u.pathname.split('/').map(s => s.trim()).filter(Boolean);
    const slug = segments[segments.length - 1] || '';
    if (!slug || slug === 'collections') return null;
    const label = slug.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()).trim();
    const words = slug.split(/[-_]/).map(w => w.toLowerCase()).filter(w => w.length >= 3);
    const phrase = words.join(' ');
    return { label, slug, words, phrase, url };
  } catch { return null; }
}

function groupKeywords(keywords, collUrls, siteUrl) {
  const brand = extractBrand(siteUrl);

  // 1. Hard filters — strip before grouping
  const filtered = keywords.filter(kw => {
    if (/\bbest\b/i.test(kw.keyword))    return false;
    if (/\bnear me\b/i.test(kw.keyword)) return false;
    return true;
  });

  // 2. Dynamic rules from collection URLs — sit just below Branded in priority
  const parsedCollections = collUrls
    .map(parseCollectionUrl)
    .filter(Boolean)
    .filter((c, i, arr) => arr.findIndex(x => x.slug === c.slug) === i);

  const collectionRules = parsedCollections.map((col, i) => ({
    name: col.label,
    slug: col.slug,
    priority: 195 - i,
    collectionUrl: col.url,
    match: kw => {
      const k = kw.toLowerCase();
      if (col.phrase.length > 3 && k.includes(col.phrase)) return true;
      if (col.words.length > 0 && col.words.every(w => new RegExp('\\b' + w, 'i').test(k))) return true;
      return false;
    },
  }));

  // 3. Static fallback rules (priorities 5–200, collections sit at 131–195)
  const staticRules = [
    {
      name: 'Branded Keywords', priority: 200,
      match: kw => brand && new RegExp('\\b' + brand + '\\b', 'i').test(kw),
    },
    {
      name: 'Informational Intent', priority: 88,
      match: kw => /^(how|what|where|why|when|which|who|can|should|is|are|do|does|will|would)\s/i.test(kw)
                || /\b(how to|what is|what are|are there|do i|does it|can you|which is)\b/i.test(kw),
    },
    {
      name: 'Benefits', priority: 86,
      match: kw => /\b(benefit|benefits|advantage|why use|worth it|good for|healthy|health|wellness|safe|safety|bpa.?free|non.?toxic|food.?grade|save money|save the planet|reduce waste|reduce plastic|less plastic|no plastic|plastic free|chemical free|leak.?proof|spill.?proof|keeps?.?(hot|cold|warm)|long.?lasting|durable|durability|lightweight|easy to clean|dishwasher safe|odou?r.?free|taste.?free|no taste|no smell)\b/i.test(kw),
    },
    {
      name: 'Buy / Shop Intent', priority: 84,
      match: kw => /\b(buy|shop|order|purchase|online store|for sale|cheap|affordable|discount|deal|on sale|price|cost|how much|free shipping|delivery|in stock|where to (buy|get|find|purchase))\b/i.test(kw),
    },
    {
      name: 'Comparison & Reviews', priority: 82,
      match: kw => /\b(vs\.?|versus|compare|comparison|review|reviews|rated|rating|alternative|alternatives|difference between)\b/i.test(kw),
    },
    {
      name: 'Location-Based', priority: 80,
      match: kw => /\b(sydney|melbourne|brisbane|perth|adelaide|canberra|hobart|darwin|gold coast|newcastle|wollongong|geelong|townsville|cairns|toowoomba|ballarat|bendigo|albury|launceston|mackay|rockhampton|bunbury|bundaberg|wagga wagga|coffs harbour|shepparton|port macquarie|tamworth|dubbo|parramatta|bondi|manly|surry hills|fitzroy|st kilda|south yarra|richmond|fortitude valley|fremantle|subiaco|nsw|vic|qld|wa|sa|tas|nt|act|australia|australian)\b/i.test(kw),
    },
    {
      name: 'Colour', priority: 78,
      match: kw => /\b(black|white|grey|gray|red|blue|green|pink|purple|yellow|orange|brown|beige|cream|navy|teal|turquoise|coral|gold|silver|rose gold|nude|mint|lilac|lavender|sage|olive|charcoal|blush|sand|copper|bronze|multicolou?r|colou?red|colou?rful|pastel|neon|clear|transparent|frosted|monochrome|two.?tone)\b/i.test(kw),
    },
    {
      name: 'Size', priority: 76,
      match: kw => /\b(small|large|medium|mini|tiny|big|tall|short|slim|wide|narrow|compact|oversized|extra large|xl|xxl)\b/i.test(kw)
               || /\d+\s*(oz|ml|litre|liter|\bl\b)/i.test(kw),
    },
    {
      name: 'Reusable & Eco', priority: 74,
      match: kw => /\b(reusabl|eco.?friendly|sustainab|zero.?waste|compostable|biodegradable|plastic.?free|carbon|environment|planet|ethical)\b/i.test(kw),
    },
    {
      name: 'Stainless Steel', priority: 72,
      match: kw => /\b(stainless.?steel|stainless|steel)\b/i.test(kw),
    },
    {
      name: 'Glass', priority: 71,
      match: kw => /\bglass\b/i.test(kw) && /\b(cup|mug|bottle|tumbler|jar|flask)\b/i.test(kw),
    },
    {
      name: 'Ceramic & Porcelain', priority: 70,
      match: kw => /\b(ceramic|porcelain|stoneware|earthenware)\b/i.test(kw),
    },
    {
      name: 'Plastic & BPA-Free', priority: 69,
      match: kw => /\b(plastic|acrylic|bpa.?free|polypropylene|tritan|polycarbonate)\b/i.test(kw),
    },
    {
      name: 'Silicone', priority: 68,
      match: kw => /\bsilicone\b/i.test(kw),
    },
    {
      name: 'Insulated & Thermal', priority: 67,
      match: kw => /\b(insulated|thermal|double.?wall|vacuum.?sealed|vacuum|thermos|keeps?.?(hot|cold|warm)|temperature.?control)\b/i.test(kw),
    },
    {
      name: 'Iced & Cold Drinks', priority: 66,
      match: kw => /\b(iced|cold.?brew|cold.?coffee|cold.?drink|iced.?latte|iced.?tea|frozen|frappuccino|smoothie|chilled)\b/i.test(kw),
    },
    {
      name: 'Espresso & Specialty Coffee', priority: 65,
      match: kw => /\b(espresso|piccolo|macchiato|cortado|flat white|cappuccino|latte|lungo|ristretto|babycino|barista|affogato|doppio|mocha)\b/i.test(kw),
    },
    {
      name: 'Tumblers', priority: 64,
      match: kw => /\btumbler\b/i.test(kw),
    },
    {
      name: 'Travel Mugs', priority: 63,
      match: kw => /\btravel.?mug\b|\bmug.?travel\b/i.test(kw),
    },
    {
      name: 'Travel & On-the-go', priority: 62,
      match: kw => /\b(travel|commut|on.?the.?go|portable|to.?go|takeaway|take.?away|spill.?proof|leak.?proof|car.?cup|car.?holder|commuter)\b/i.test(kw),
    },
    {
      name: 'Mugs', priority: 61,
      match: kw => /\bmug\b|\bmugs\b/i.test(kw),
    },
    {
      name: 'Custom & Personalised', priority: 60,
      match: kw => /\b(custom|personalise|personalize|personalised|personalized|branded|corporate|logo|print|engraved|engraving|monogram|bespoke|bulk|wholesale|promotional|promo)\b/i.test(kw),
    },
    {
      name: 'Gifts & Sets', priority: 59,
      match: kw => /\b(gift|gifting|present|birthday|christmas|xmas|anniversary|wedding|mothers?.?day|fathers?.?day|valentines?|hamper|bundle|set|pack|kit|box)\b/i.test(kw),
    },
    {
      name: 'Kids & Baby', priority: 58,
      match: kw => /\b(kids|children|child|toddler|baby|infant|sippy|junior|school)\b/i.test(kw),
    },
    {
      name: 'Water Bottles & Hydration', priority: 57,
      match: kw => /\b(water.?bottle|drink.?bottle|hydration|flask|canteen|sports?.?bottle|gym.?bottle|hiking.?bottle)\b/i.test(kw)
               || (/\bbottle\b/i.test(kw) && /\b(water|drink|hydrat|sport|gym|run|hike|outdoor|camp)\b/i.test(kw)),
    },
    {
      name: 'Takeaway & Disposable', priority: 56,
      match: kw => /\b(disposable|single.?use|paper.?cup|cardboard.?cup|takeaway.?cup|cafe.?cup|compostable.?cup|biodegradable.?cup)\b/i.test(kw),
    },
    {
      name: 'Accessories & Parts', priority: 55,
      match: kw => /\b(straw|sleeve|band|handle|grip|coaster|brush|cleaner|replacement|spare|lid|cap|stopper|seal|gasket|mat|carry.?bag|case|pouch|clip|carabiner|hook)\b/i.test(kw),
    },
    {
      name: 'Broad / Generic', priority: 5,
      match: kw => /\b(cup|cups|mug|mugs|bottle|bottles|flask|flasks|tumbler|tumblers|vessel|container|drinkware|coffeeware|barware|kitchenware|coffee|tea|drink|beverage)\b/i.test(kw),
    },
  ];

  const allRules = [...staticRules, ...collectionRules].sort((a, b) => b.priority - a.priority);

  // 4. Group keywords
  const groupMap = {};
  allRules.forEach(r => { groupMap[r.name] = []; });
  groupMap['Other / Uncategorised'] = [];

  const collectionUrlMap = {};
  collectionRules.forEach(r => { collectionUrlMap[r.name] = r.collectionUrl; });

  filtered.forEach(kw => {
    let matched = false;
    for (const rule of allRules) {
      try {
        if (rule.match(kw.keyword)) {
          groupMap[rule.name].push(kw);
          matched = true;
          break;
        }
      } catch (e) {}
    }
    if (!matched) groupMap['Other / Uncategorised'].push(kw);
  });

  // 5. Sort & return
  return Object.entries(groupMap)
    .filter(([, rows]) => rows.length > 0)
    .map(([name, rows]) => ({
      label: name,
      slug: name.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
      rows,
      collectionUrl: collectionUrlMap[name] || null,
      isCollection: !!collectionUrlMap[name],
    }))
    .sort((a, b) => {
      if (a.slug === 'branded-keywords')     return -1;
      if (b.slug === 'branded-keywords')     return 1;
      if (a.isCollection && !b.isCollection) return -1;
      if (!a.isCollection && b.isCollection) return 1;
      if (a.slug.includes('other'))          return 1;
      if (b.slug.includes('other'))          return -1;
      return b.rows.length - a.rows.length;
    });
}


function App() {
  const [tab, setTab] = useState(0);
  const [siteUrl, setSiteUrl] = useState('');
  const [collections, setCollections] = useState('');
  const [clientRows, setClientRows] = useState([]);
  const [compRows, setCompRows] = useState([]);
  const [status, setStatus] = useState({ type: '', msg: '' });
  const [groups, setGroups] = useState([]);
  const [expanded, setExpanded] = useState(null);
  const [filterSrc, setFilterSrc] = useState('all');
  const [searchQ, setSearchQ] = useState('');

  // Client paste columns
  const [clientKeywords, setClientKeywords] = useState('');
  const [clientVolumes, setClientVolumes] = useState('');
  const [clientPositions, setClientPositions] = useState('');
  const [clientUrls, setClientUrls] = useState('');

  // Competitor paste columns
  const [compKeywords, setCompKeywords] = useState('');
  const [compVolumes, setCompVolumes] = useState('');

  // Parse a pasted column into an array of trimmed non-empty lines
  const parseCol = (text) => text.split('\n').map(l => l.trim()).filter(Boolean);

  const buildClientRows = useCallback(() => {
    const kws = parseCol(clientKeywords);
    if (!kws.length) { setStatus({ type: 'err', msg: 'Paste at least one keyword' }); return; }
    const vols = parseCol(clientVolumes);
    const pos  = parseCol(clientPositions);
    const urls = parseCol(clientUrls);
    const rows = kws.map((kw, i) => ({
      keyword:  kw.toLowerCase().trim(),
      sv:       parseInt((vols[i] || '0').replace(/[^0-9]/g, ''), 10) || 0,
      position: pos[i]  ? parseInt((pos[i]).replace(/[^0-9]/g, ''), 10) || null : null,
      url:      urls[i] ? urls[i].trim() : 'N/A',
      source:   'Client',
      location: '',
    })).filter(r => r.keyword.length > 0);
    setClientRows(rows);
    const urlCount = rows.filter(r => r.url !== 'N/A').length;
    const posCount = rows.filter(r => r.position).length;
    setStatus({ type: 'ok', msg: `${rows.length} client keywords · ${urlCount} URLs · ${posCount} positions` });
  }, [clientKeywords, clientVolumes, clientPositions, clientUrls]);

  const buildCompRows = useCallback(() => {
    const kws  = parseCol(compKeywords);
    if (!kws.length) { setStatus({ type: 'err', msg: 'Paste at least one competitor keyword' }); return; }
    const vols = parseCol(compVolumes);
    const rows = kws.map((kw, i) => ({
      keyword:  kw.toLowerCase().trim(),
      sv:       parseInt((vols[i] || '0').replace(/[^0-9]/g, ''), 10) || 0,
      position: null,
      url:      'N/A',
      source:   'Competitor',
      location: '',
    })).filter(r => r.keyword.length > 0);
    setCompRows(rows);
    setStatus({ type: 'ok', msg: `${rows.length} competitor keywords loaded` });
  }, [compKeywords, compVolumes]);

  const runGrouping = useCallback(() => {
    const allKws = [...clientRows, ...compRows];
    if (!allKws.length) {
      setStatus({ type: 'err', msg: 'Paste some keywords first' });
      return;
    }
    
    // Deduplicate keywords (keep highest volume version if duplicates exist)
    const deduped = {};
    allKws.forEach(kw => {
      const key = kw.keyword.toLowerCase().trim();
      if (!deduped[key] || kw.sv > deduped[key].sv) {
        deduped[key] = kw;
      }
    });
    const uniqueKws = Object.values(deduped);
    const duplicatesRemoved = allKws.length - uniqueKws.length;
    const filteredOut = uniqueKws.filter(kw => /\bbest\b/i.test(kw.keyword) || /\bnear me\b/i.test(kw.keyword)).length;
    
    const collUrls = collections.trim() ? collections.split('\n').map(l => l.trim()).filter(Boolean) : [];
    const result = groupKeywords(uniqueKws, collUrls, siteUrl);
    setGroups(result);
    setExpanded(result[0]?.slug || null);
    setTab(4);
    
    let msg = `${result.length} groups created`;
    if (duplicatesRemoved > 0) msg += ` • ${duplicatesRemoved} duplicates removed`;
    if (filteredOut > 0) msg += ` • ${filteredOut} filtered (best/near me)`;
    setStatus({ type: 'ok', msg });
  }, [clientRows, compRows, collections, siteUrl]);

  const doExport = useCallback(() => {
    try {
      if (!groups?.length) return setStatus({ type: 'err', msg: 'No data' });
      const rows = [['Keyword', 'Search Volume', 'Position', 'URL', 'Group', 'Source']];
      groups.forEach(g => g.rows?.forEach(r => rows.push([
        r.keyword ?? '',
        r.sv ?? 0,
        r.source === 'Competitor' ? 'N/A' : (r.position ?? ''),
        r.url ?? '',
        g.label ?? '',
        r.source ?? ''
      ])));
      const csv = '\uFEFF' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'calibre9-groups.csv';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
      setStatus({ type: 'ok', msg: 'Downloaded' });
    } catch (err) {
      setStatus({ type: 'err', msg: 'Export failed' });
    }
  }, [groups]);

  const exportToSheets = useCallback(async () => {
    try {
      if (!groups?.length) {
        setStatus({ type: 'err', msg: 'No data' });
        return;
      }
      
      const rows = [['Keyword', 'Search Volume', 'Position', 'URL', 'Group', 'Source']];
      groups.forEach(g => g.rows?.forEach(r => rows.push([
        r.keyword ?? '',
        r.sv ?? 0,
        r.source === 'Competitor' ? 'N/A' : (r.position ?? ''),
        r.url ?? '',
        g.label ?? '',
        r.source ?? ''
      ])));
      
      const tsv = rows.map(r => r.join('\t')).join('\n');
      
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(tsv);
          setStatus({ type: 'ok', msg: '✓ Copied! Paste into Google Sheets (Ctrl+V / Cmd+V)' });
          return;
        } catch (clipErr) {
          console.log('Clipboard failed:', clipErr);
        }
      }
      
      const blob = new Blob([tsv], { type: 'text/tab-separated-values;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'calibre9-groups.tsv';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { 
        document.body.removeChild(a); 
        URL.revokeObjectURL(url); 
      }, 100);
      setStatus({ type: 'ok', msg: 'TSV downloaded - File > Import in Google Sheets' });
      
    } catch (err) {
      console.error('Export failed:', err);
      setStatus({ type: 'err', msg: 'Export failed: ' + err.message });
    }
  }, [groups]);

  const resetAll = useCallback(() => {
    if (confirm('Reset all data? This will clear your URL, keywords, collections, and groups.')) {
      setSiteUrl('');
      setCollections('');
      setClientRows([]);
      setCompRows([]);
      setClientKeywords('');
      setClientVolumes('');
      setClientPositions('');
      setClientUrls('');
      setCompKeywords('');
      setCompVolumes('');
      setGroups([]);
      setExpanded(null);
      setFilterSrc('all');
      setSearchQ('');
      setStatus({ type: '', msg: '' });
      setTab(0);
    }
  }, []);

  const filteredGroups = groups.map(g => ({ ...g, rows: g.rows.filter(r => (filterSrc === 'all' || r.source.toLowerCase() === filterSrc) && (!searchQ || r.keyword.includes(searchQ.toLowerCase()))) })).filter(g => g.rows.length > 0);
  const totalSV = groups.reduce((s, g) => s + g.rows.reduce((ss, r) => ss + r.sv, 0), 0);
  const totalKws = groups.reduce((s, g) => s + g.rows.length, 0);

  return (
    <div style={{ minHeight: '100vh', background: C.black, color: C.white, fontFamily: "'Montserrat',sans-serif", position: 'relative', overflow: 'hidden' }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
          font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
        }
        
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        @keyframes flicker { 0%,100%{opacity:1} 93%{opacity:.75} 94%{opacity:1} }
        @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .head {

            { label: '#11–20',  range: [11,20], color: C.magenta },
            { label: '#21–50',  range: [21,50], color: '#ff8c00' },
            { label: '#51+',    range: [51,999],color: C.textgrey },
          ];
          const bucketed = buckets.map(b => ({
            ...b,
            kws: ranked.filter(r => r.position >= b.range[0] && r.position <= b.range[1]),
            sv:  ranked.filter(r => r.position >= b.range[0] && r.position <= b.range[1]).reduce((s,r) => s+r.sv, 0),
          }));
          const maxBucketKws = Math.max(...bucketed.map(b => b.kws.length), 1);
          const maxBucketSv  = Math.max(...bucketed.map(b => b.sv), 1);

          const p2Opps      = [...p2].sort((a,b) => b.sv - a.sv).slice(0, 10);
          const quickWins   = [...p1].filter(r => r.position >= 8).sort((a,b) => b.sv - a.sv).slice(0, 8);
          const top10p1     = [...p1].sort((a,b) => b.sv - a.sv).slice(0, 10);
          const totalTrackedSv = p1sv + p2sv;
          const p1Pct = totalTrackedSv > 0 ? Math.round(p1sv / totalTrackedSv * 100) : 0;
          const p2Pct = 100 - p1Pct;

          const Donut = ({ pct, color, size = 130, stroke = 15 }) => {
            const r = (size - stroke) / 2;
            const circ = 2 * Math.PI * r;
            const dash = (pct / 100) * circ;
            return (
              <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
                <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={C.border} strokeWidth={stroke} />
                <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
                  strokeDasharray={`${dash} ${circ}`} strokeLinecap="round" />
              </svg>
            );
          };

          if (clientRows.length === 0) return (
            <div style={{ animation: 'fadeUp 0.3s', textAlign: 'center', padding: '100px 0' }}>
              <div className="head" style={{ fontSize: 44, color: C.textgrey }}>NO DATA</div>
              <p style={{ color: C.textgrey, fontSize: 13, marginTop: 12 }}>Add client keywords with position data first.</p>
              <button onClick={() => setTab(1)} style={{ background: C.indigo, color: '#fff', border: 'none', padding: '11px 28px', fontWeight: 900, fontSize: 11, cursor: 'pointer', marginTop: 24, borderRadius: 10 }}>← Add Keywords</button>
            </div>
          );

          return (
            <div style={{ animation: 'fadeUp 0.3s' }}>
              <h2 className="head" style={{ fontSize: 44, marginBottom: 6 }}>ANALYSIS</h2>
              <p style={{ fontSize: 12, color: C.textgrey, marginBottom: 32 }}>
                {clientRows.length} client keywords · {ranked.length} with position data
              </p>

              {/* Big stat cards */}
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16, marginBottom: 28 }}>
                {[
                  { label: 'Page 1 Keywords',      value: p1.length,              sub: `${p1Pct}% of tracked SV`,    color: C.volt },
                  { label: 'Page 1 Search Volume', value: p1sv.toLocaleString(),  sub: 'total monthly searches',     color: C.volt },
                  { label: 'Page 2 Keywords',      value: p2.length,              sub: `${p2Pct}% of tracked SV`,    color: C.magenta },
                  { label: 'Page 2 Search Volume', value: p2sv.toLocaleString(),  sub: 'total monthly searches',     color: C.magenta },
                ].map((s, i) => (
                  <div key={i} className="stat-card" style={{ padding: '22px 20px' }}>
                    <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: C.textgrey, marginBottom: 10 }}>{s.label}</div>
                    <div className="head" style={{ fontSize: 34, letterSpacing: '-0.02em', background: `linear-gradient(135deg, ${s.color}, ${C.white})`, WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text' }}>{s.value}</div>
                    <div style={{ fontSize: 10, color: C.textgrey, marginTop: 6 }}>{s.sub}</div>
                  </div>
                ))}
              </div>

              {/* Donut + Position distribution */}
              <div style={{ display: 'grid', gridTemplateColumns: '280px 1fr', gap: 20, marginBottom: 28 }}>
                <div style={{ background: C.darkgrey, border: `1px solid ${C.border}`, borderRadius: 16, padding: 28 }}>
                  <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: C.textgrey, marginBottom: 20 }}>SV Share — P1 vs P2</div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
                    <div style={{ position: 'relative', flexShrink: 0 }}>
                      <Donut pct={p1Pct} color={C.volt} />
                      <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
                        <div className="head" style={{ fontSize: 24, color: C.volt }}>{p1Pct}%</div>
                        <div style={{ fontSize: 9, color: C.textgrey, letterSpacing: '0.1em' }}>P1 SV</div>
                      </div>
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                      {[
                        { label: 'Page 1', sv: p1sv, kws: p1.length, color: C.volt },
                        { label: 'Page 2', sv: p2sv, kws: p2.length, color: C.magenta },
                      ].map((row, i) => (
                        <div key={i}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
                            <div style={{ width: 8, height: 8, borderRadius: 2, background: row.color, flexShrink: 0 }} />
                            <span style={{ fontSize: 10, fontWeight: 700, color: C.lightgrey }}>{row.label}</span>
                          </div>
                          <div style={{ fontSize: 18, fontWeight: 900, color: row.color }}>{row.sv.toLocaleString()}</div>
                          <div style={{ fontSize: 10, color: C.textgrey }}>{row.kws} keywords</div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div style={{ background: C.darkgrey, border: `1px solid ${C.border}`, borderRadius: 16, padding: 28 }}>
                  <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: C.textgrey, marginBottom: 20 }}>Position Distribution — Keyword Count</div>
                  <div style={{ display: 'grid', gridTemplateColumns: `repeat(${buckets.length}, 1fr)`, gap: 10, alignItems: 'flex-end', height: 140 }}>
                    {bucketed.map((b, i) => {
                      const pct = maxBucketKws > 0 ? (b.kws.length / maxBucketKws) * 100 : 0;
                      return (
                        <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8, height: '100%', justifyContent: 'flex-end' }}>
                          <div style={{ fontSize: 11, fontWeight: 700, color: b.color }}>{b.kws.length}</div>
                          <div style={{ width: '100%', background: C.grey, borderRadius: 6, overflow: 'hidden', height: 90, display: 'flex', alignItems: 'flex-end' }}>
                            <div style={{ width: '100%', height: `${pct}%`, background: b.color, borderRadius: 6, minHeight: b.kws.length > 0 ? 4 : 0 }} />
                          </div>
                          <div style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: 10, fontWeight: 800, color: C.white, whiteSpace: 'nowrap' }}>{b.label}</div>
                            <div style={{ fontSize: 9, color: C.textgrey, marginTop: 2 }}>{b.sv.toLocaleString()}</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* Top P1 keywords horizontal bar chart */}
              <div style={{ background: C.darkgrey, border: `1px solid ${C.border}`, borderRadius: 16, padding: 28, marginBottom: 28 }}>
                <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: C.textgrey, marginBottom: 20 }}>Top Page 1 Keywords by Search Volume</div>
                {top10p1.length === 0 ? <div style={{ color: C.textgrey, fontSize: 12 }}>No page 1 keywords with position data.</div> : (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
                    {top10p1.map((r, i) => {
                      const pct = (r.sv / top10p1[0].sv) * 100;
                      let urlPath = '—';
                      try { urlPath = r.url && r.url !== 'N/A' ? new URL(r.url.startsWith('http') ? r.url : 'https://' + r.url).pathname.slice(0, 22) : '—'; } catch {}
                      return (
                        <div key={i} style={{ display: 'grid', gridTemplateColumns: '36px 1fr 80px 90px', gap: 12, alignItems: 'center' }}>
                          <div style={{ fontSize: 10, fontWeight: 900, color: i < 3 ? C.volt : C.textgrey, textAlign: 'right', fontFamily: 'monospace' }}>#{r.position}</div>
                          <div style={{ position: 'relative', borderRadius: 4, overflow: 'hidden' }}>
                            <div style={{ position: 'absolute', inset: 0, background: `${C.volt}1a`, width: `${pct}%`, borderRadius: 4 }} />
                            <div style={{ position: 'relative', padding: '5px 10px', fontSize: 12, fontWeight: 500, color: C.white, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{r.keyword}</div>
                          </div>
                          <div style={{ fontSize: 12, fontWeight: 700, color: C.volt, textAlign: 'right' }}>{r.sv.toLocaleString()}</div>
                          <div style={{ fontSize: 9, color: C.textgrey, textAlign: 'right', fontFamily: 'monospace', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{urlPath}</div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* P2 Opportunities + Quick Wins side by side */}
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, marginBottom: 28 }}>
                <div style={{ background: C.darkgrey, border: `1px solid ${C.magenta}44`, borderRadius: 16, padding: 28 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 18 }}>
                    <div style={{ width: 8, height: 8, background: C.magenta, borderRadius: 2 }} />
                    <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: C.textgrey }}>Page 2 — Highest SV Opportunities</div>
                  </div>
                  {p2Opps.length === 0 ? <div style={{ color: C.textgrey, fontSize: 12 }}>No page 2 data.</div> : (
                    <div style={{ display: 'flex', flexDirection: 'column' }}>
                      {p2Opps.map((r, i) => (
                        <div key={i} style={{ display: 'grid', gridTemplateColumns: '36px 1fr 70px', gap: 10, alignItems: 'center', padding: '8px 0', borderBottom: i < p2Opps.length - 1 ? `1px solid ${C.border}` : 'none' }}>
                          <span style={{ fontFamily: 'monospace', fontSize: 11, color: C.magenta, fontWeight: 700 }}>#{r.position}</span>
                          <span style={{ fontSize: 12, color: C.white, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.keyword}</span>
                          <span style={{ fontSize: 11, fontWeight: 700, color: C.magenta, textAlign: 'right' }}>{r.sv.toLocaleString()}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div style={{ background: C.darkgrey, border: `1px solid ${C.volt}44`, borderRadius: 16, padding: 28 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                    <div style={{ width: 8, height: 8, background: C.volt, borderRadius: 2 }} />
                    <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: C.textgrey }}>Quick Wins — Positions 8–10</div>
                  </div>
                  <p style={{ fontSize: 11, color: C.textgrey, marginBottom: 16 }}>Page 1 keywords on the cusp — small gains here move these into top 7.</p>
                  {quickWins.length === 0 ? <div style={{ color: C.textgrey, fontSize: 12 }}>No keywords ranked 8–10.</div> : (
                    <div style={{ display: 'flex', flexDirection: 'column' }}>
                      {quickWins.map((r, i) => (
                        <div key={i} style={{ display: 'grid', gridTemplateColumns: '36px 1fr 70px', gap: 10, alignItems: 'center', padding: '8px 0', borderBottom: i < quickWins.length - 1 ? `1px solid ${C.border}` : 'none' }}>
                          <span style={{ fontFamily: 'monospace', fontSize: 11, color: C.volt, fontWeight: 700 }}>#{r.position}</span>
                          <span style={{ fontSize: 12, color: C.white, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.keyword}</span>
                          <span style={{ fontSize: 11, fontWeight: 700, color: C.volt, textAlign: 'right' }}>{r.sv.toLocaleString()}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>

              {/* SV by position bucket horizontal bars */}
              <div style={{ background: C.darkgrey, border: `1px solid ${C.border}`, borderRadius: 16, padding: 28 }}>
                <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: C.textgrey, marginBottom: 20 }}>Search Volume by Position Bucket</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                  {bucketed.filter(b => b.sv > 0).map((b, i) => {
                    const pct = (b.sv / maxBucketSv) * 100;
                    return (
                      <div key={i} style={{ display: 'grid', gridTemplateColumns: '64px 1fr 100px 52px', gap: 14, alignItems: 'center' }}>
                        <div style={{ fontSize: 11, fontWeight: 800, color: b.color, textAlign: 'right' }}>{b.label}</div>
                        <div style={{ height: 26, background: C.grey, borderRadius: 6, overflow: 'hidden' }}>
                          <div style={{ height: '100%', width: `${pct}%`, background: `linear-gradient(90deg, ${b.color}, ${b.color}77)`, borderRadius: 6, transition: 'width 1s ease' }} />
                        </div>
                        <div style={{ fontSize: 12, fontWeight: 700, color: b.color, textAlign: 'right' }}>{b.sv.toLocaleString()}</div>
                        <div style={{ fontSize: 10, color: C.textgrey, textAlign: 'right' }}>{b.kws.length} kw</div>
                      </div>
                    );
                  })}
                </div>
              </div>

            </div>
          );
        })()}


      </div>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
